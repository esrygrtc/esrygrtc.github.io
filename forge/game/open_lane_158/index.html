<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10141b">
<title>OPEN LANE — P1 Greybox</title>
<style>
:root{color-scheme:dark;--cell:60px;--ease-out-cubic:cubic-bezier(0.33,1,0.68,1);--ack-ms:50ms;--amber:#ffb41f;--teal:#23c6c3;--violet:#964bd3;--lime:#f35b57;--art-background:none;--art-tile-a:none;--art-tile-b:none;--art-frame-corner:none;--art-frame-h:none;--art-frame-v:none;--art-amber:none;--art-teal:none;--art-violet:none;--art-lime:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow:hidden;background:#123f5c var(--art-background) center/cover no-repeat;color:#fff0cc;font-family:ui-rounded,system-ui,sans-serif;touch-action:none}
body{display:flex;justify-content:center}
#app{width:min(100vw,430px);min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px}
header{width:100%;display:flex;align-items:flex-end;justify-content:space-between}
h1{font-size:18px;letter-spacing:.12em;margin:0}
#prompt{font-size:12px;color:#aab4c0;margin-top:3px}
#level-tabs{display:flex;gap:5px}
button{min-width:48px;min-height:40px;border:0;border-radius:14px;background:#fff0cc var(--art-frame-h) center/100% 100% no-repeat;color:#123f5c;font:800 13px system-ui;padding:8px 12px;box-shadow:0 5px 10px #061b2999}
button:active{transform:scale(.97)}
button[aria-current=true]{border-color:#e9f1f8;background:#354353}
#playfield{position:relative;margin:8px auto 12px;flex:1 1 auto;display:flex;align-items:center;justify-content:center;width:100%}
#frame-art{position:absolute;inset:-18px;z-index:0;pointer-events:none}
#frame-art i{position:absolute;display:block;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
#frame-art .top,#frame-art .bottom{left:18px;right:18px;height:28px;background-image:var(--art-frame-h)}
#frame-art .left,#frame-art .right{top:18px;bottom:18px;width:28px;background-image:var(--art-frame-v)}
#frame-art .top{top:0}#frame-art .bottom{bottom:0;rotate:180deg}#frame-art .left{left:0}#frame-art .right{right:0;rotate:180deg}
#frame-art .corner{width:38px;height:38px;background-image:var(--art-frame-corner)}
#frame-art .nw{left:0;top:0}#frame-art .ne{right:0;top:0;rotate:90deg}#frame-art .se{right:0;bottom:0;rotate:180deg}#frame-art .sw{left:0;bottom:0;rotate:270deg}
#board{position:relative;z-index:1;width:calc(var(--cell) * var(--cols));height:calc(var(--cell) * var(--rows));background:#123f5c;border:0;border-radius:10px;box-shadow:0 16px 38px #051b2999;overflow:visible}
.grid-cell,.wall,.echo-ghost{position:absolute;width:var(--cell);height:var(--cell);pointer-events:none}
.grid-cell{border:0;background-position:center;background-size:cover}
.grid-cell.tile-a{background-image:var(--art-tile-a)}.grid-cell.tile-b{background-image:var(--art-tile-b)}
.wall{background:#294c60 var(--art-tile-b) center/cover;border:3px solid #fff0cc88;box-shadow:inset 0 0 0 2px #0e3550}
.echo-ghost{z-index:2;border:3px dashed currentColor;background:color-mix(in srgb,currentColor 18%,transparent);opacity:.7}
.echo-ghost.extend::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;font:900 22px system-ui}
.echo-ghost.retract::after{content:"−";position:absolute;inset:0;display:grid;place-items:center;font:900 24px system-ui}
.echo-ghost.skipped::before{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:3px solid currentColor;transform:rotate(-25deg)}
.gate{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;border:0;font-size:0;background-position:center;background-size:100% 100%;background-repeat:no-repeat;filter:drop-shadow(0 3px 4px #061b2999)}
.gate.amber{background-image:var(--art-amber)}.gate.teal{background-image:var(--art-teal)}.gate.violet{background-image:var(--art-violet)}.gate.lime{background-image:var(--art-lime)}
.gate[data-side=N]{height:28px;top:-22px}
.gate[data-side=S]{height:28px;bottom:-22px}
.gate[data-side=W]{width:28px;left:-22px}
.gate[data-side=E]{width:28px;right:-22px}
.block{position:absolute;z-index:5;left:0;top:0;touch-action:none;user-select:none;will-change:translate,scale,filter;scale:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18));transition:scale 48ms var(--ease-out-cubic),filter 48ms var(--ease-out-cubic)}
.block-cell{position:absolute;width:var(--cell);height:var(--cell);border-radius:9px;border:0;display:grid;place-items:center;font-size:0;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.block.grabbed{scale:1.04;filter:drop-shadow(0 6px 6px rgba(0,0,0,.28));z-index:10}
.block.grabbed .block-cell{outline:3px solid #fff}
.gate.chain-flare{z-index:12}
.echo-fx{position:absolute;z-index:13;width:var(--cell);height:var(--cell);pointer-events:none;border:4px solid currentColor;border-radius:8px}
.echo-fx.retract{background:#697583;box-shadow:inset 0 0 0 2px #3d4752}
.echo-fx.extend{background:currentColor}
#board.clear-bloom{animation:clear-bloom 240ms var(--ease-out-cubic) both}
@keyframes clear-bloom{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.06) saturate(1.08)}}
.amber{color:var(--amber)}.teal{color:var(--teal)}.violet{color:var(--violet)}.lime{color:var(--lime)}
.block-cell.amber{background-image:var(--art-amber)}.block-cell.teal{background-image:var(--art-teal)}.block-cell.violet{background-image:var(--art-violet)}.block-cell.lime{background-image:var(--art-lime)}
#status{width:100%;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center;color:#c6d0da;font-size:13px}
#status.win{color:#b8ef95;font-weight:800}
#status.win.chain-win{animation:win-chip 240ms var(--ease-out-cubic) 120ms both}
@keyframes win-chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#chip{position:absolute;z-index:20;left:50%;top:10px;transform:translateX(-50%);white-space:nowrap;background:#252f3b;border:1px solid #718093;border-radius:99px;padding:7px 12px;font-size:12px;display:none}
#chip.show{display:block}
#controls{display:flex;gap:8px;justify-content:center;padding-bottom:4px}
#principle{color:#9bb0bd;font-size:10px;text-align:center}
/* T2/T3/T8 — shell screens (#160) · P7: ≤50ms ack via --ack-ms · P8: audio init on PLAY gesture */
.screen-overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(16,20,27,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:20px}
.screen-overlay.show{display:flex}
.big-play{min-width:190px;min-height:74px;font-size:28px;font-weight:900;letter-spacing:.15em;border-radius:22px;transition:transform var(--ack-ms) var(--ease-out-cubic)}
.big-play:active{transform:scale(.94)}
.big-play:disabled{opacity:.55}
.icon-btn{position:fixed;top:max(12px,env(safe-area-inset-top));right:14px;z-index:49;width:44px;height:44px;border-radius:50%;font-size:20px;display:grid;place-items:center;transition:transform var(--ack-ms) var(--ease-out-cubic);background:rgba(37,47,59,.85);color:#fff0cc}
.icon-btn:active{transform:scale(.92)}
.result-card{display:flex;flex-direction:column;align-items:center;gap:18px;padding:36px 30px;border-radius:22px;background:#1a2735;border:1px solid #3a4a5a;max-width:320px;text-align:center}
.result-card h2{margin:0;font-size:26px;letter-spacing:.1em}
.result-card.complete h2{color:#b8ef95}
.result-card.fail h2{color:#ff6b6b}
.result-card p{margin:0;font-size:13px;color:#aab4c0;line-height:1.5}
.result-btns{display:flex;gap:12px}
.result-btns button{transition:transform var(--ack-ms) var(--ease-out-cubic);min-height:48px}
.result-btns button:active{transform:scale(.94)}
.settings-card{display:flex;flex-direction:column;gap:14px;padding:26px 22px;border-radius:22px;background:#1a2735;border:1px solid #3a4a5a;min-width:270px}
.settings-card h3{margin:0 0 6px;font-size:16px;letter-spacing:.1em}
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.toggle{width:50px;height:30px;border-radius:15px;background:#3a4a5a;border:0;position:relative;transition:background var(--ack-ms) var(--ease-out-cubic);cursor:pointer;min-width:50px;min-height:30px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform var(--ack-ms) var(--ease-out-cubic)}
.toggle.on{background:var(--teal)}
.toggle.on::after{transform:translateX(20px)}
.settings-card>button{min-height:44px;transition:transform var(--ack-ms) var(--ease-out-cubic)}
.settings-card>button:active{transform:scale(.95)}
.menu-title{font-size:34px;letter-spacing:.18em;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.5)}
</style>
</head>
<body>
<main id="app">
  <header>
    <div><h1>OPEN LANE</h1><div id="prompt">Slide each shape through its matching edge.</div></div>
    <nav id="level-tabs" aria-label="Level select"></nav>
  </header>
  <section id="status" aria-live="polite">Loading greybox…</section>
  <div id="playfield"><div id="frame-art" aria-hidden="true"><i class="top"></i><i class="right"></i><i class="bottom"></i><i class="left"></i><i class="corner nw"></i><i class="corner ne"></i><i class="corner se"></i><i class="corner sw"></i></div><div id="board" aria-label="Puzzle board"><div id="chip"></div></div></div>
  <div id="controls"><button id="undo" type="button">Undo</button><button id="restart" type="button">Restart</button></div>
  <div id="principle">Greybox · colour + symbol · free recovery</div>
  <!-- T2: Menu screen — title + one PLAY button + settings icon -->
  <div id="screen-menu" class="screen-overlay show">
    <h1 class="menu-title">OPEN LANE</h1>
    <button class="big-play" id="play-btn" type="button" disabled>LOADING…</button>
  </div>
  <!-- T3: Level Complete -->
  <div id="screen-complete" class="screen-overlay">
    <div class="result-card complete">
      <h2>LEVEL CLEAR</h2>
      <div class="result-btns">
        <button id="next-btn" type="button">NEXT</button>
        <button id="home-complete" type="button">HOME</button>
      </div>
    </div>
  </div>
  <!-- T3: Fail / Dead End -->
  <div id="screen-fail" class="screen-overlay">
    <div class="result-card fail">
      <h2>DEAD END</h2>
      <p>No way to clear this board.</p>
      <div class="result-btns">
        <button id="retry-btn" type="button">RETRY</button>
        <button id="home-fail" type="button">HOME</button>
      </div>
    </div>
  </div>
  <!-- T8: Settings panel -->
  <div id="screen-settings" class="screen-overlay">
    <div class="settings-card">
      <h3>SETTINGS</h3>
      <div class="toggle-row"><span>Sound</span><button class="toggle on" id="toggle-sound" type="button" aria-label="Sound"></button></div>
      <div class="toggle-row"><span>Music</span><button class="toggle on" id="toggle-music" type="button" aria-label="Music"></button></div>
      <button id="settings-restart" type="button">Restart Level</button>
      <button id="settings-back" type="button">Back</button>
    </div>
  </div>
  <!-- T8: Settings icon -->
  <button class="icon-btn" id="settings-open" type="button" aria-label="Settings">⚙</button>
</main>
<script type="module">
// OPEN LANE #158 — pure deterministic model. No DOM, clocks, RNG, or globals.

const COLOR_SYMBOL = Object.freeze({
  amber: "circle",
  teal: "triangle",
  violet: "square",
  lime: "cross",
});

const DIR = Object.freeze({
  N: [0, -1],
  E: [1, 0],
  S: [0, 1],
  W: [-1, 0],
});

const MAX_STEPS_PER_FRAME = 4;

const copyPoint = ([x, y]) => [x, y];
const copyBlock = (block) => ({
  ...block,
  cells: block.cells.map(copyPoint),
  at: copyPoint(block.at),
});
const copyGate = (gate) => ({
  ...gate,
  span: [...gate.span],
  echo: gate.echo
    ? { ...gate.echo, cells: gate.echo.cells.map(copyPoint) }
    : null,
});
const copyFrame = (frame) => ({
  blocks: frame.blocks.map(copyBlock),
  walls: frame.walls.map(copyPoint),
  gateFired: { ...frame.gateFired },
});

function frameOf(state) {
  return {
    blocks: state.blocks.map(copyBlock),
    walls: state.walls.map(copyPoint),
    gateFired: { ...state.gateFired },
  };
}

function cloneState(state) {
  return {
    level: {
      ...state.level,
      grid: { ...state.level.grid },
      initialWalls: state.level.initialWalls.map(copyPoint),
      gates: state.level.gates.map(copyGate),
    },
    blocks: state.blocks.map(copyBlock),
    walls: state.walls.map(copyPoint),
    gateFired: { ...state.gateFired },
    history: state.history.map(copyFrame),
    lastAction: state.lastAction ? { ...state.lastAction } : null,
  };
}

function cellKey(x, y) {
  return `${x},${y}`;
}

function blockFootprint(block, at = block.at) {
  return block.cells.map(([dx, dy]) => [at[0] + dx, at[1] + dy]);
}

function occupiedKeys(state, exceptBlockId = null) {
  const occupied = new Set(state.walls.map(([x, y]) => cellKey(x, y)));
  for (const block of state.blocks) {
    if (block.id === exceptBlockId) continue;
    for (const [x, y] of blockFootprint(block)) occupied.add(cellKey(x, y));
  }
  return occupied;
}

function isInside(state, x, y) {
  return x >= 0 && y >= 0 && x < state.level.grid.w && y < state.level.grid.h;
}

function loadLevel(json) {
  const level = {
    id: json.id,
    grid: { w: json.grid.w, h: json.grid.h },
    initialWalls: (json.walls || []).map(copyPoint),
    gates: (json.gates || []).map(copyGate),
    par: json.par,
  };
  return {
    level,
    blocks: json.blocks.map(copyBlock),
    walls: level.initialWalls.map(copyPoint),
    gateFired: Object.fromEntries(level.gates.map((gate) => [gate.id, false])),
    history: [],
    lastAction: null,
  };
}

function legalStep(state, blockId, dx, dy) {
  if (Math.abs(dx) + Math.abs(dy) !== 1) return false;
  const block = state.blocks.find((candidate) => candidate.id === blockId);
  if (!block) return false;
  const to = [block.at[0] + dx, block.at[1] + dy];
  const occupied = occupiedKeys(state, blockId);
  for (const [x, y] of blockFootprint(block, to)) {
    if (!isInside(state, x, y) || occupied.has(cellKey(x, y))) return false;
  }
  return true;
}

function applyDrag(state, blockId, toAt) {
  const next = cloneState(state);
  const block = next.blocks.find((candidate) => candidate.id === blockId);
  if (!block || !Array.isArray(toAt) || toAt.length !== 2) return next;

  const before = frameOf(state);
  let remainingX = Math.trunc(toAt[0]) - block.at[0];
  let remainingY = Math.trunc(toAt[1]) - block.at[1];
  let steps = 0;

  while ((remainingX !== 0 || remainingY !== 0) && steps < MAX_STEPS_PER_FRAME) {
    const xFirst = Math.abs(remainingX) >= Math.abs(remainingY);
    const primary = xFirst
      ? [Math.sign(remainingX), 0]
      : [0, Math.sign(remainingY)];
    const secondary = xFirst
      ? [0, Math.sign(remainingY)]
      : [Math.sign(remainingX), 0];

    let moved = false;
    for (const [dx, dy] of [primary, secondary]) {
      if (dx === 0 && dy === 0) continue;
      if (legalStep(next, blockId, dx, dy)) {
        block.at[0] += dx;
        block.at[1] += dy;
        remainingX -= dx;
        remainingY -= dy;
        moved = true;
        break;
      }
    }
    if (!moved) break;
    steps += 1;
  }

  if (block.at[0] !== state.blocks.find((b) => b.id === blockId)?.at[0]
      || block.at[1] !== state.blocks.find((b) => b.id === blockId)?.at[1]) {
    if (!(state.lastAction?.type === "drag" && state.lastAction.blockId === blockId)) {
      next.history.push(before);
    }
    next.lastAction = { type: "drag", blockId };
  }
  return next;
}

function gateAllowsCrossing(gate, x, y) {
  const [start, len] = gate.span;
  const edgeCoordinate = gate.side === "N" || gate.side === "S" ? x : y;
  return edgeCoordinate >= start && edgeCoordinate < start + len;
}

function pathClearsGate(state, block, gate) {
  const [dx, dy] = DIR[gate.side];
  const occupied = occupiedKeys(state, block.id);
  let at = copyPoint(block.at);
  const max = state.level.grid.w + state.level.grid.h
    + Math.max(...block.cells.flatMap(([x, y]) => [x, y])) + 4;

  for (let step = 0; step < max; step += 1) {
    const previous = blockFootprint(block, at);
    at = [at[0] + dx, at[1] + dy];
    const footprint = blockFootprint(block, at);
    let anyInside = false;

    for (let i = 0; i < footprint.length; i += 1) {
      const [x, y] = footprint[i];
      const [oldX, oldY] = previous[i];
      if (isInside(state, x, y)) {
        anyInside = true;
        if (occupied.has(cellKey(x, y))) return false;
      } else if (isInside(state, oldX, oldY) && !gateAllowsCrossing(gate, oldX, oldY)) {
        return false;
      }
    }
    if (!anyInside) return true;
  }
  return false;
}

function canExit(state, blockId) {
  const block = state.blocks.find((candidate) => candidate.id === blockId);
  if (!block) return null;
  for (const gate of state.level.gates) {
    if (gate.color === block.color && pathClearsGate(state, block, gate)) return gate.id;
  }
  return null;
}

function applyExit(state, blockId, gateId) {
  const block = state.blocks.find((candidate) => candidate.id === blockId);
  const gate = state.level.gates.find((candidate) => candidate.id === gateId);
  if (!block || !gate || gate.color !== block.color || !pathClearsGate(state, block, gate)) {
    return { state: cloneState(state), echoDelta: [] };
  }

  const next = cloneState(state);
  if (!(state.lastAction?.type === "drag" && state.lastAction.blockId === blockId)) {
    next.history.push(frameOf(state));
  }
  next.blocks = next.blocks.filter((candidate) => candidate.id !== blockId);
  const echoDelta = [];

  if (gate.echo && !next.gateFired[gate.id]) {
    const walls = new Set(next.walls.map(([x, y]) => cellKey(x, y)));
    const occupied = occupiedKeys(next);
    for (const [x, y] of gate.echo.cells) {
      const key = cellKey(x, y);
      if (gate.echo.type === "RETRACT") {
        const before = walls.has(key) ? "WALL" : "EMPTY";
        walls.delete(key);
        echoDelta.push({ cell: [x, y], before, after: "EMPTY" });
      } else if (gate.echo.type === "EXTEND" && !occupied.has(key)) {
        const before = walls.has(key) ? "WALL" : "EMPTY";
        walls.add(key);
        echoDelta.push({ cell: [x, y], before, after: "WALL" });
      }
    }
    next.walls = [...walls].map((key) => key.split(",").map(Number));
    next.gateFired[gate.id] = true;
  }
  next.lastAction = { type: "exit", blockId, gateId };
  return { state: next, echoDelta };
}

function undo(state) {
  if (state.history.length === 0) return cloneState(state);
  const next = cloneState(state);
  const previous = next.history.pop();
  next.blocks = previous.blocks.map(copyBlock);
  next.walls = previous.walls.map(copyPoint);
  next.gateFired = { ...previous.gateFired };
  next.lastAction = { type: "undo" };
  return next;
}

function isClear(state) {
  return state.blocks.length === 0;
}

function snapshot(state) {
  return {
    levelId: state.level.id,
    blocks: state.blocks
      .map((block) => ({ id: block.id, at: copyPoint(block.at) }))
      .sort((a, b) => a.id.localeCompare(b.id)),
    walls: state.walls.map(copyPoint).sort(([ax, ay], [bx, by]) => ay - by || ax - bx),
    gateFired: Object.fromEntries(Object.entries(state.gateFired).sort()),
  };

const toggleSoundBtn = document.querySelector("#toggle-sound");
const toggleMusicBtn = document.querySelector("#toggle-music");

let levels = {};
let levelId = "L1";
let sourceLevel;
let state;
let phase = "boot";
let drag = null;
let timing = INLINE_TIMING;
let audioEvents = INLINE_AUDIO_EVENTS;
let lastChain = null;
let levelsReady = false;
let soundOn = true;
let musicOn = true;
let currentScreen = "menu";
const SEARCH_CAP = 200000;
const DEAD_END_MSG = "no way to clear this board — undo or restart";
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// T2/T3/T8 — screen manager: one overlay at a time, settings gear visibility
function showScreen(name){
  document.querySelectorAll(".screen-overlay").forEach((el) => el.classList.remove("show"));
  currentScreen = name;
  if(name === "menu") document.querySelector("#screen-menu").classList.add("show");
  else if(name === "complete") document.querySelector("#screen-complete").classList.add("show");
  else if(name === "fail") document.querySelector("#screen-fail").classList.add("show");
  else if(name === "settings") document.querySelector("#screen-settings").classList.add("show");
  // Settings gear: visible on menu + game, hidden behind result/settings overlays
  settingsOpen.style.display = (name === "game" || name === "menu") ? "" : "none";
}

// R10′ dead-end detection — bounded BFS on the shipped model after each exit settles.
function _snapKey(st){return JSON.stringify(OL.snapshot(st))}
function _placementStates(st,blockId){
  const out=[],seen=new Set([_snapKey(st)]),q=[st];
  while(q.length){
    const cur=q.shift();const b=cur.blocks.find(x=>x.id===blockId);if(!b)continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      if(!OL.legalStep(cur,blockId,dx,dy))continue;
      const nxt=OL.applyDrag(cur,blockId,[b.at[0]+dx,b.at[1]+dy]);
      const k=_snapKey(nxt);if(seen.has(k))continue;seen.add(k);out.push(nxt);q.push(nxt);
    }
  }
  return out;
}
function isBoardSolvable(st){
  const start=_snapKey(st);const nodes=new Map([[start,st]]);const q=[start];
  while(q.length){
    const k=q.shift(),cur=nodes.get(k);
    if(OL.isClear(cur))return true;
    const succ=[];
    for(const b of cur.blocks){
      for(const p of _placementStates(cur,b.id))succ.push(p);
      const gid=OL.canExit(cur,b.id);if(gid)succ.push(OL.applyExit(cur,b.id,gid).state);
    }
    for(const s of succ){
      const nk=_snapKey(s);if(nodes.has(nk))continue;
      if(nodes.size>=SEARCH_CAP)return true; // assume solvable if search space too large
      nodes.set(nk,s);q.push(nk);
    }
  }
  return false;
}
function checkDeadEnd(){
  if(OL.isClear(state))return;
  if(!isBoardSolvable(state)){
    chip.textContent=DEAD_END_MSG;chip.classList.add("show");
    setTimeout(()=>{
      if(!OL.isClear(state)&&phase!=="win"&&!isBoardSolvable(state)) showScreen("fail");
    },1200);
  }
}

class AudioBus {
  constructor(){
    this.context=null;this.buffers=new Map();this.voices=Array.from({length:4},()=>({source:null,gain:null}));
    this.cursor=0;this.warned=new Set();this.ready=false;this.enabled=true;
  }
  contextOrNull(){
    if(this.context)return this.context;
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return null;
    this.context=new Context();return this.context;
  }
  async preload(){
    const context=this.contextOrNull();if(!context||!audioEvents)return;
    await Promise.all(audioEvents.events.map(async(event)=>{
      try{
        const source=INLINE_AUDIO?.[event.id]||`./audio/${event.file}`;
        const bytes=await fetch(source).then((response)=>response.arrayBuffer());
        this.buffers.set(event.id,await context.decodeAudioData(bytes));
      }catch(error){this.warnOnce(event.id,error)}
    }));
    this.ready=this.buffers.size===audioEvents.events.length;
  }
  unlock(){const context=this.contextOrNull();if(context?.state==="suspended")void context.resume()}
  play(id){
    if(!this.enabled)return;
    const context=this.contextOrNull(),buffer=this.buffers.get(id);
    if(!context||!buffer){this.warnOnce(id,new Error("audio not decoded"));return}
    const config=audioEvents.events.find((event)=>event.id===id);
    const voice=this.voices[this.cursor++%this.voices.length];
    try{voice.source?.stop()}catch{}
    const source=context.createBufferSource(),gain=context.createGain();
    gain.gain.value=config.runtime_gain;source.buffer=buffer;source.connect(gain);gain.connect(context.destination);
    voice.source=source;voice.gain=gain;source.start();
  }
  warnOnce(id,error){
    if(this.warned.has(id))return;
    this.warned.add(id);console.warn(`OPEN LANE audio ${id}: ${error.message}`);
  }
  status(){return{decoded:[...this.buffers.keys()].sort(),voices:this.voices.length,ready:this.ready,enabled:this.enabled}}
}
const audioBus=new AudioBus();

function pointKey(x,y){return `${x},${y}`}
function footprint(block,at=block.at){return block.cells.map(([dx,dy])=>[at[0]+dx,at[1]+dy])}
function occupiedAt(x,y,exceptId=null){
  if(state.walls.some(([wx,wy])=>wx===x&&wy===y)) return true;
  return state.blocks.some((block)=>block.id!==exceptId&&footprint(block).some(([bx,by])=>bx===x&&by===y));
}
function cellFromEvent(event){
  const rect=board.getBoundingClientRect();
  const cell=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"));
  return [Math.floor((event.clientX-rect.left)/cell),Math.floor((event.clientY-rect.top)/cell)];
}
function position(element,x,y){
  if(element.classList.contains("block"))element.style.translate=`calc(${x} * var(--cell)) calc(${y} * var(--cell))`;
  else element.style.transform=`translate3d(calc(${x} * var(--cell)),calc(${y} * var(--cell)),0)`;
}
function colorOf(gate){return `var(--${gate.color})`}
function installArt(){
  const art=INLINE_ART||DEV_ART;
  for(const [id,source] of Object.entries(art))document.documentElement.style.setProperty(`--art-${id}`,`url("${source}")`);
  return art;
}

function render(){
  const priorChip=board.querySelector("#chip");
  board.replaceChildren(priorChip);board.classList.remove("clear-bloom");
  board.style.setProperty("--cols",state.level.grid.w);
  board.style.setProperty("--rows",state.level.grid.h);
  const cell=Math.max(40,Math.min(72,Math.floor((Math.min(innerWidth,430)-48)/state.level.grid.w),Math.floor((innerHeight-220)/state.level.grid.h)));
  document.documentElement.style.setProperty("--cell",`${cell}px`);

  for(let y=0;y<state.level.grid.h;y++)for(let x=0;x<state.level.grid.w;x++){
    const tile=document.createElement("div");tile.className=`grid-cell tile-${(x+y)%2?"b":"a"}`;position(tile,x,y);board.append(tile);
  }
  for(const [x,y] of state.walls){
    const wall=document.createElement("div");wall.className="wall";position(wall,x,y);board.append(wall);
  }
  const occupied=new Set(state.blocks.flatMap((block)=>footprint(block).map(([x,y])=>pointKey(x,y))));
  for(const gate of state.level.gates){
    if(gate.echo&&!state.gateFired[gate.id])for(const [x,y] of gate.echo.cells){
      const ghost=document.createElement("div");
      ghost.className=`echo-ghost ${gate.color} ${gate.echo.type.toLowerCase()}${occupied.has(pointKey(x,y))?" skipped":""}`;
      position(ghost,x,y);board.append(ghost);
    }
    const edge=document.createElement("div");
    edge.className=`gate ${gate.color}`;
    edge.dataset.gateId=gate.id;edge.dataset.side=gate.side;edge.style.color=colorOf(gate);edge.textContent=SYMBOL[OL.COLOR_SYMBOL[gate.color]];
    if(gate.side==="N"||gate.side==="S"){
      edge.style.left=`calc(${gate.span[0]} * var(--cell))`;edge.style.width=`calc(${gate.span[1]} * var(--cell))`;
    }else{
      edge.style.top=`calc(${gate.span[0]} * var(--cell))`;edge.style.height=`calc(${gate.span[1]} * var(--cell))`;
    }
    board.append(edge);
  }
  for(const block of state.blocks){
    const root=document.createElement("div");root.className="block";root.dataset.blockId=block.id;position(root,block.at[0],block.at[1]);
    for(const [dx,dy] of block.cells){
      const cellEl=document.createElement("div");cellEl.className=`block-cell ${block.color}`;
      cellEl.style.transform=`translate(calc(${dx} * var(--cell)),calc(${dy} * var(--cell)))`;
      cellEl.textContent=SYMBOL[block.symbol];root.append(cellEl);
    }
    root.addEventListener("pointerdown",startDrag);board.append(root);
  }
  const clear=OL.isClear(state);
  status.textContent=clear?"Lane clear. Try the next board.":"Drag a shape to the same symbol at the edge.";
  status.className=clear?"win":"";
  phase=clear?"win":"play";
  undoButton.disabled=state.history.length===0;
  tabs.replaceChildren(...Object.keys(levels).sort().map((id)=>{
    const button=document.createElement("button");button.textContent=id;button.dataset.level=id;button.setAttribute("aria-current",id===levelId);
    button.addEventListener("click",()=>load(id));return button;
  }));
}

function startDrag(event){
  if(phase!=="play")return;
  const id=event.currentTarget.dataset.blockId;
  const block=state.blocks.find((candidate)=>candidate.id===id);
  if(!block)return;
  const pointer=cellFromEvent(event);
  drag={id,element:event.currentTarget,grab:[pointer[0]-block.at[0],pointer[1]-block.at[1]]};
  audioBus.unlock();audioBus.play("grab_tick");
  drag.element.setPointerCapture(event.pointerId);drag.element.classList.add("grabbed");
  drag.element.addEventListener("pointermove",moveDrag);drag.element.addEventListener("pointerup",endDrag,{once:true});
  drag.element.addEventListener("pointercancel",endDrag,{once:true});phase="drag";
}

function moveDrag(event){
  if(!drag)return;
  const pointer=cellFromEvent(event);
  state=OL.applyDrag(state,drag.id,[pointer[0]-drag.grab[0],pointer[1]-drag.grab[1]]);
  const block=state.blocks.find((candidate)=>candidate.id===drag.id);
  position(drag.element,block.at[0],block.at[1]);
}

function gateDelta(gate,element){
  const rect=element.getBoundingClientRect(),cell=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"));
  if(gate.side==="N")return[0,-rect.height-8-cell];
  if(gate.side==="S")return[0,rect.height+8+cell];
  if(gate.side==="W")return[-rect.width-8-cell,0];
  return[rect.width+8+cell,0];
}

function animateEcho(echo){
  if(!echo)return;
  for(const [x,y] of echo.cells){
    const fx=document.createElement("div");fx.className=`echo-fx ${echo.type.toLowerCase()}`;
    position(fx,x,y);board.append(fx);
    const retract=echo.type==="RETRACT";
    fx.animate(
      retract
        ?[{transform:"scale(1)",opacity:1},{transform:"scale(.82)",opacity:0}]
        :[{transform:"scale(.82)",opacity:0},{transform:"scale(1)",opacity:1}],
      {duration:timing.beats[5].duration_ms,easing:timing.easeOutCubic,fill:"forwards"}
    ).finished.finally(()=>fx.remove());
  }
}

function commitExitChain(id,gateId,element){
  const gate=state.level.gates.find((candidate)=>candidate.id===gateId);
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const chainMs=reduced?Math.min(50,timing.beats[6].reduced_motion_input_reenable_max_ms):timing.beats[6].duration_ms;
  const echoAt=reduced?0:timing.beats[5].start_ms;
  const [dx,dy]=gateDelta(gate,element);
  phase="exit";lastChain={gateId,startedAt:performance.now(),inputReenabledAt:null,reduced};
  audioBus.play("exit_whoosh");
  if(!reduced){
    element.animate(
      [{transform:"translate(0,0) scale(1.04)",opacity:1},{transform:`translate(${dx}px,${dy}px) scale(1.04)`,opacity:.9}],
      {duration:timing.beats[3].duration_ms,easing:timing.easeOutCubic,fill:"forwards"}
    );
    const gateElement=board.querySelector(`[data-gate-id="${gateId}"]`);
    gateElement?.animate(
      [{transform:"scale(1)",opacity:1},{transform:"scale(1.12)",opacity:1,offset:64/200},{transform:"scale(1)",opacity:1}],
      {duration:timing.beats[4].duration_ms,easing:timing.easeOutCubic}
    );
  }
  setTimeout(()=>{
    state=OL.applyExit(state,id,gateId).state;
    if(gate.echo)audioBus.play("echo_thunk");
    render();phase="echo";
    if(!reduced)animateEcho(gate.echo);
    if(OL.isClear(state)){board.classList.add("clear-bloom");status.classList.add("chain-win")}
  },echoAt);
  setTimeout(()=>{
    phase=OL.isClear(state)?"win":"play";
    lastChain.inputReenabledAt=performance.now();
    if(phase==="win") setTimeout(()=>{if(phase==="win") showScreen("complete")},350);
    if(phase==="play")checkDeadEnd();
  },chainMs);
}

function endDrag(){
  if(!drag)return;
  const id=drag.id;drag.element.classList.remove("grabbed");drag.element.removeEventListener("pointermove",moveDrag);
  const gateId=OL.canExit(state,id);
  if(gateId)commitExitChain(id,gateId,drag.element);
  else state={...state,lastAction:null};
  drag=null;
  if(!gateId){phase="play";render()}
}

function load(id){
  if(!levels[id])return;
  levelId=id;sourceLevel=structuredClone(levels[id]);state=OL.loadLevel(sourceLevel);chip.className="";render();
}

function debugExit(gateId){
  for(const block of state.blocks){
    if(OL.canExit(state,block.id)===gateId){state=OL.applyExit(state,block.id,gateId).state;render();return true}
  }
  return false;
}

// T2/PULSE — boot shows menu immediately; levels + art load in background
async function boot(){
  const art=installArt();
  showScreen("menu");
  // Background loading — menu is already visible and interactive
  try{
    await Promise.all(Object.values(art).map((source)=>new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=reject;image.src=source})));
  }catch{ /* art optional for menu */ }
  if(!timing)timing=await fetch("../../game/design/motion/issue_158_open_lane/timing.json",{cache:"no-store"}).then((response)=>response.json());
  if(!audioEvents)audioEvents=await fetch("../../game/design/motion/issue_158_open_lane/event_map.json",{cache:"no-store"}).then((response)=>response.json());
  document.documentElement.style.setProperty("--ease-out-cubic",timing.easeOutCubic);
  if(INLINE_LEVELS) levels=INLINE_LEVELS;
  else for(const id of LEVEL_IDS)try{
    const response=await fetch(`./levels/${id}.json`,{cache:"no-store"});
    if(response.ok)levels[id]=await response.json();
  }catch{}
  if(!levels.L1)throw new Error("L1 unavailable");
  levelsReady=true;
  playBtn.disabled=false;
  playBtn.textContent="PLAY";
  // P8 cold-boot: pre-decode audio in background during boot.
  // A suspended AudioContext can still decodeAudioData — resume happens on
  // first user gesture (PLAY tap or first block drag).  This eliminates the
  // first-touch decode lockout on BOTH the menu path and the ?level= deep-link.
  audioBus.contextOrNull();
  try{await audioBus.preload()}catch{}
}

// T2/PULSE — PLAY gesture: visual ack via CSS :active, audio init on user gesture, decode before board
playBtn.addEventListener("click",async()=>{
  if(!levelsReady)return;
  // CSS :active already acknowledged in ≤50ms; update label for transition gap
  playBtn.textContent="LOADING…";
  playBtn.disabled=true;
  // User gesture: resume the AudioContext (already decoded during boot)
  audioBus.unlock();
  // Show board at L1 (or ?level= param)
  load(new URLSearchParams(location.search).get("level") in levels?new URLSearchParams(location.search).get("level"):"L1");
  showScreen("game");
});

// T3 — Complete screen: NEXT advances or returns to menu
nextBtn.addEventListener("click",()=>{
  const idx=LEVEL_IDS.indexOf(levelId);
  const nextId=idx>=0&&idx<LEVEL_IDS.length-1?LEVEL_IDS[idx+1]:null;
  if(nextId&&levels[nextId]){load(nextId);showScreen("game")}
  else showScreen("menu");
});
homeCompleteBtn.addEventListener("click",()=>showScreen("menu"));

// T3 — Fail screen: RETRY reloads current level
retryBtn.addEventListener("click",()=>{load(levelId);showScreen("game")});
homeFailBtn.addEventListener("click",()=>showScreen("menu"));

// T8 — Settings panel
settingsOpen.addEventListener("click",()=>showScreen("settings"));
settingsBack.addEventListener("click",()=>showScreen("game"));
settingsRestart.addEventListener("click",()=>{load(levelId);showScreen("game")});
toggleSoundBtn.addEventListener("click",()=>{
  soundOn=!soundOn;
  toggleSoundBtn.classList.toggle("on",soundOn);
  audioBus.enabled=soundOn;
});
toggleMusicBtn.addEventListener("click",()=>{
  musicOn=!musicOn;
  toggleMusicBtn.classList.toggle("on",musicOn);
});

// Undo/restart also clear any open result overlay
undoButton.addEventListener("click",()=>{
  if(phase==="play"||phase==="win"){
    state=OL.undo(state);chip.classList.remove("show");
    if(currentScreen!=="game") showScreen("game");
    render();
  }
});
restartButton.addEventListener("click",()=>{
  if(phase==="play"||phase==="win"){
    load(levelId);
    if(currentScreen!=="game") showScreen("game");
  }
});
addEventListener("resize",()=>state&&render());

window.olDebug={
  level:()=>levelId,
  phase:()=>phase,
  screen:()=>currentScreen,
  result:()=>OL.isClear(state)?"clear":null,
  blocksLeft:()=>state.blocks.length,
  gates:()=>structuredClone(state.level.gates),
  legalExits:()=>state.blocks.map((block)=>({blockId:block.id,gateId:OL.canExit(state,block.id)})).filter((entry)=>entry.gateId),
  applyExit:debugExit,
  snapshot:()=>OL.snapshot(state),
  timing:()=>structuredClone(timing),
  audio:()=>audioBus.status(),
  lastChain:()=>lastChain?structuredClone(lastChain):null
  ,art:()=>({source:"CANVAS R2 signal-yard",count:Object.keys(INLINE_ART||DEV_ART).length})
};

boot().catch((error)=>{phase="error";status.textContent=`Build error: ${error.message}`});
</script>
